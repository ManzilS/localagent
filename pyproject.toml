[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localagent"
version = "0.4.0"
description = "An experimental local-first AI assistant for files, code, web research, documents, and desktop tasks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nick" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "psutil>=5.9",
  "segno>=1.6",
  "keyring>=24",
  "icalendar>=5.0",
  "recurring-ical-events>=2.1",
  "playwright>=1.45",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
vision = ["pypdfium2>=4.30", "mss>=9.0", "Pillow>=10.0"]
office = ["python-pptx>=0.6"]
desktop = ["pyautogui>=0.9.54", "mss>=9.0", "Pillow>=10.0", "pyperclip>=1.8", "uiautomation>=2.0; sys_platform == 'win32'"]
app = ["pywebview>=5.0"]
voice = ["faster-whisper>=1.0"]
all = ["playwright>=1.45", "pypdfium2>=4.30", "mss>=9.0", "Pillow>=10.0", "python-pptx>=0.6", "trafilatura>=1.9",
       "pyautogui>=0.9.54", "pyperclip>=1.8", "uiautomation>=2.0; sys_platform == 'win32'", "pywebview>=5.0", "faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
localagent = "localagent.cli:main"

[project.urls]
Repository = "https://github.com/ManzilS/localagent"
Issues = "https://github.com/ManzilS/localagent/issues"

[project.gui-scripts]
localagent-app = "localagent.app:main"

[tool.setuptools.packages.find]
include = ["localagent*"]

[tool.setuptools.package-data]
localagent = ["web/*.html", "skills_builtin/*/SKILL.md"]
